name: DiagServerChan

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Runner egress info
        run: |
          curl -s --max-time 20 https://ipinfo.io/json || echo "(ipinfo failed)"
          echo ""
      - name: Test minimal push
        env:
          SC_URL: ${{ secrets.SERVERCHAN_URL }}
        run: |
          echo "secret length: ${#SC_URL}"
          code=$(curl -s -o /tmp/o1.txt -w "%{http_code}" --max-time 30 -X POST "$SC_URL" --data-urlencode "title=Horizon diag A" --data-urlencode "desp=minimal form from GH Actions")
          echo "HTTP=$code"
          cat /tmp/o1.txt
          echo ""
      - name: Test json push
        env:
          SC_URL: ${{ secrets.SERVERCHAN_URL }}
        run: |
          code=$(curl -s -o /tmp/o2.txt -w "%{http_code}" --max-time 30 -X POST "$SC_URL" -H "Content-Type: application/json" -d '{"title":"Horizon diag B","desp":"json body from GH Actions"}')
          echo "HTTP=$code"
          cat /tmp/o2.txt
          echo ""
